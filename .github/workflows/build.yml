name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: "17"
        distribution: "temurin"

    - name: Setup Gradle 8.2 (Stabil Sürüm)
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: "8.2"

    - name: Build Debug APK
      run: gradle testDebugUnitTest assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: maarif-takvimi-apk
        path: app/build/outputs/apk/debug/app-debug.apk

    # Yalniz main'e push'ta: APK'yi herkesin hesapsiz indirebilecegi sabit bir surume koy.
    # Link: https://github.com/geceleriesen/maariftakvim/releases/latest/download/MaarifTakvimi.apk
    - name: Publish APK to latest release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk MaarifTakvimi.apk
        gh release delete latest --yes --cleanup-tag || true
        gh release create latest MaarifTakvimi.apk \
          --title "Büyük Saatli Maarif Takvimi (son sürüm)" \
          --notes "Son derleme: ${GITHUB_SHA::7}. Kurulum adımları için README'ye bak." \
          --latest
